name: Tests and lint

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages the build needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Unit tests, lint and release build
        # Without keystore.properties the release build is signed with a debug key.
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --console=plain
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
